<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1440px;overflow:hidden;}
  body{position:relative;background:#080808;color:#f4f4f4;}
  /* clipped-waveform diagonal energy, upper third */
  .band{position:absolute;left:-200px;width:1600px;transform:rotate(-13deg);}
  .b3{height:14px;top:360px;background:#ff2d8b;}
  .b1{height:150px;top:400px;background:#d6ff3a;}
  .b2{height:40px;top:570px;background:#ff2d8b;}
  .top{position:absolute;top:84px;left:96px;right:96px;display:flex;
    justify-content:space-between;font-family:'BigShoulders';font-weight:700;
    font-size:34px;letter-spacing:8px;color:#f4f4f4;}
  .mass{position:absolute;top:640px;left:90px;}
  .mass .l{font-family:'BigShoulders';font-weight:700;font-size:212px;line-height:.82;
    letter-spacing:-1px;color:#f4f4f4;}
  .cn{position:absolute;top:1006px;left:96px;font-family:'WenQuanYi Zen Hei';
    font-weight:900;font-size:104px;letter-spacing:22px;color:#d6ff3a;}
  /* equalizer register: repeating amplitude bars */
  .eq{position:absolute;left:96px;right:96px;top:1168px;height:84px;
    display:flex;align-items:flex-end;gap:11px;}
  .eq i{flex:1;background:#ff2d8b;display:block;}
  .foot{position:absolute;left:96px;right:96px;bottom:96px;display:flex;
    justify-content:space-between;align-items:flex-end;}
  .date{font-family:'BigShoulders';font-weight:700;font-size:92px;letter-spacing:-1px;
    color:#d6ff3a;line-height:.9;}
  .place{font-family:'JetBrainsMono';font-size:25px;letter-spacing:3px;
    color:#9a9a9a;text-align:right;line-height:1.7;}
</style></head><body>
  <div class="band b3"></div>
  <div class="band b1"></div>
  <div class="band b2"></div>
  <div class="top"><span>SOUNDWAVE</span><span>FEST / 2026</span></div>
  <div class="mass">
    <div class="l">SOUND</div>
    <div class="l">WAVE</div>
  </div>
  <div class="cn">声 浪</div>
  <div class="eq">
    <i style="height:34%"></i><i style="height:66%"></i><i style="height:46%"></i>
    <i style="height:90%"></i><i style="height:56%"></i><i style="height:100%"></i>
    <i style="height:42%"></i><i style="height:74%"></i><i style="height:36%"></i>
    <i style="height:92%"></i><i style="height:50%"></i><i style="height:68%"></i>
    <i style="height:30%"></i><i style="height:82%"></i><i style="height:54%"></i>
    <i style="height:96%"></i><i style="height:40%"></i><i style="height:62%"></i>
  </div>
  <div class="foot">
    <div class="date">08.16—18</div>
    <div class="place">滨江公园<br>RIVERSIDE PARK</div>
  </div>
</body></html>
