<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1440px;overflow:hidden;}
  body{position:relative;background:#0b0b0d;color:#ece6d6;}
  /* charged darkness: a low warm horizon glow */
  .glow{position:absolute;left:50%;bottom:-340px;width:1500px;height:1500px;
    transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(circle,rgba(201,162,75,.42) 0%,rgba(201,162,75,.12) 32%,rgba(11,11,13,0) 60%);}
  .vign{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%);}
  .frame{position:absolute;inset:64px;border:1px solid rgba(201,162,75,.32);}
  .pad{position:absolute;inset:104px;display:flex;flex-direction:column;}
  .top{display:flex;justify-content:space-between;align-items:baseline;
    font-family:'JetBrainsMono';font-size:24px;letter-spacing:5px;color:#c9a24b;}
  /* systematic star coordinates */
  .marks{position:absolute;font-family:'JetBrainsMono';font-size:18px;
    letter-spacing:2px;color:rgba(201,162,75,.40);}
  .m1{top:300px;left:104px;} .m2{top:300px;right:104px;text-align:right;}
  .m3{bottom:430px;left:104px;}
  .tick{position:absolute;width:1px;height:38px;background:rgba(201,162,75,.45);}
  .center{margin-top:380px;}
  .kicker{font-family:'InstrumentSerifIt';font-style:italic;font-size:58px;
    color:#c9a24b;letter-spacing:2px;}
  .title{font-family:'Gloock','WenQuanYi Zen Hei';font-size:228px;line-height:1.02;
    color:#f3eddb;letter-spacing:6px;margin-top:6px;}
  .rule{width:140px;height:2px;background:#c9a24b;margin:46px 0 30px;}
  .line{font-family:'WenQuanYi Zen Hei';font-size:38px;letter-spacing:10px;color:#b6ac90;}
  .foot{position:absolute;left:104px;right:104px;bottom:104px;display:flex;
    justify-content:space-between;align-items:flex-end;
    font-family:'JetBrainsMono';font-size:23px;letter-spacing:4px;color:rgba(236,230,214,.55);}
  .seal{font-family:'Italiana';font-size:40px;color:#c9a24b;letter-spacing:4px;}
</style></head><body>
  <div class="glow"></div>
  <div class="vign"></div>
  <div class="frame"></div>
  <span class="marks m1">23°47′N</span>
  <span class="marks m2">FIG. XII</span>
  <span class="marks m3">∞ / 00:24</span>
  <div class="tick" style="top:560px;left:300px;"></div>
  <div class="tick" style="top:600px;left:760px;"></div>
  <div class="tick" style="top:520px;right:300px;"></div>
  <div class="pad">
    <div class="top"><span>NOCTURNE</span><span>深夜读书会 · NO.12</span></div>
    <div class="center">
      <div class="kicker">after midnight</div>
      <div class="title">深夜<br>读书</div>
      <div class="rule"></div>
      <div class="line">把 一 本 书 ， 读 到 天 亮</div>
    </div>
  </div>
  <div class="foot"><span>每周三 · 线上共读</span><span class="seal">MMXXVI</span></div>
</body></html>
