<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1440px; overflow:hidden; }
  body { background:#f4f1ea; color:#1a1a1a; position:relative;
    font-family:"DejaVu Sans","WenQuanYi Zen Hei",sans-serif;
    display:flex; flex-direction:column; padding:84px; }
  .top { display:flex; justify-content:space-between; font-size:30px;
    letter-spacing:6px; font-weight:700; }
  .shapes { position:relative; height:560px; margin-top:30px; }
  .sq { position:absolute; left:40px; top:60px; width:300px; height:300px; background:#2b50e0; }
  .ci { position:absolute; right:70px; top:20px; width:330px; height:330px;
    border-radius:50%; background:#e23b2e; mix-blend-mode:multiply; }
  .tr { position:absolute; left:330px; bottom:0; width:0; height:0;
    border-left:170px solid transparent; border-right:170px solid transparent;
    border-bottom:300px solid #f2c029; }
  .title { margin-top:20px; }
  .cn { font-size:170px; font-weight:900; letter-spacing:14px; line-height:1; }
  .en { font-size:48px; font-weight:700; letter-spacing:10px; margin-top:20px; }
  .bottom { margin-top:auto; display:flex; justify-content:space-between;
    align-items:flex-end; font-size:32px; letter-spacing:4px; }
  .bottom .big { font-size:54px; font-weight:900; letter-spacing:0; }
</style></head><body>
  <div class="top"><span>MODERN&nbsp;DESIGN</span><span>EXPO</span></div>
  <div class="shapes"><div class="sq"></div><div class="ci"></div><div class="tr"></div></div>
  <div class="title">
    <div class="cn">形与色</div>
    <div class="en">FORM &amp; COLOR</div>
  </div>
  <div class="bottom"><span>现代设计展<br>当代美术馆 · A 馆</span><span class="big">2026</span></div>
</body></html>
