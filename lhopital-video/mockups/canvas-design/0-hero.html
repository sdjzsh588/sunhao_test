<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%;
    font-family:"DejaVu Sans","WenQuanYi Zen Hei",sans-serif; }
  body { background:#101418; color:#e8eaed; overflow:hidden; }
  .card { position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; gap:60px; }
  .icon { width:300px; height:300px; border-radius:64px; background:#1b2026;
    border:1px solid #2a3138; position:relative; overflow:hidden;
    box-shadow:0 24px 80px rgba(0,255,136,.18); }
  .icon .sq { position:absolute; left:54px; top:60px; width:120px; height:120px; background:#2b50e0; }
  .icon .ci { position:absolute; right:46px; top:42px; width:130px; height:130px;
    border-radius:50%; background:#e23b2e; mix-blend-mode:screen; }
  .icon .tr { position:absolute; left:96px; bottom:44px; width:0; height:0;
    border-left:70px solid transparent; border-right:70px solid transparent;
    border-bottom:120px solid #f2c029; }
  .word .name { font-size:128px; font-weight:800; letter-spacing:-2px; }
  .word .sub { margin-top:24px; font-size:50px; color:#9aa4ad;
    display:flex; align-items:center; gap:26px; }
  .badge { font-size:40px; font-weight:700; color:#0a0a0a;
    background:#00ff88; border-radius:999px; padding:10px 30px; }
</style></head><body>
  <div class="card">
    <div class="icon"><div class="sq"></div><div class="ci"></div><div class="tr"></div></div>
    <div class="word">
      <div class="name">canvas-design</div>
      <div class="sub"><span>Claude 官方 · 海报 / 封面设计</span><span class="badge">Skill</span></div>
    </div>
  </div>
</body></html>
