<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1440px; overflow:hidden; }
  body { background:#efe7d8; color:#3a2c20; position:relative;
    font-family:"DejaVu Sans","WenQuanYi Zen Hei",sans-serif;
    display:flex; flex-direction:column; padding:96px; }
  .top { display:flex; justify-content:space-between; font-size:30px;
    letter-spacing:7px; color:#8a7256; }
  .circle { width:560px; height:560px; border-radius:50%;
    background:radial-gradient(circle at 38% 34%, #75503a 0, #41291b 72%);
    margin:130px auto 0; box-shadow:0 40px 90px rgba(58,44,32,.30);
    position:relative; }
  .ring { position:absolute; inset:38px; border:3px solid rgba(239,231,216,.35);
    border-radius:50%; }
  .mid { text-align:center; margin-top:96px; }
  .cn { font-size:150px; font-weight:800; letter-spacing:20px; }
  .en { font-size:44px; letter-spacing:16px; color:#8a7256; margin-top:20px; }
  .bottom { margin-top:auto; text-align:center; font-size:32px;
    letter-spacing:6px; color:#8a7256; }
</style></head><body>
  <div class="top"><span>SLOW&nbsp;BREW</span><span>NO.07</span></div>
  <div class="circle"><div class="ring"></div></div>
  <div class="mid">
    <div class="cn">慢煮时光</div>
    <div class="en">SLOW · BREW · DAILY</div>
  </div>
  <div class="bottom">一杯手冲，慢下来的理由</div>
</body></html>
