<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1440px; overflow:hidden; }
  body { background:#0c0c0c; color:#f2f2f2; position:relative;
    font-family:"DejaVu Sans","WenQuanYi Zen Hei",sans-serif;
    display:flex; flex-direction:column; padding:80px; }
  .bar { position:absolute; background:#e7ff3a; }
  .b1 { width:1400px; height:120px; top:430px; left:-160px; transform:rotate(-12deg); opacity:.92; }
  .b2 { width:1400px; height:34px; top:600px; left:-160px; transform:rotate(-12deg); background:#ff4d6d; }
  .top { display:flex; justify-content:space-between; font-size:32px;
    letter-spacing:8px; font-weight:700; z-index:2; }
  .title { margin-top:auto; z-index:2; }
  .title .l { font-size:230px; font-weight:900; line-height:.92; letter-spacing:-4px; }
  .title .cn { font-size:150px; font-weight:900; letter-spacing:18px; color:#e7ff3a; }
  .meta { margin-top:48px; display:flex; justify-content:space-between;
    align-items:flex-end; z-index:2; }
  .date { font-size:88px; font-weight:900; letter-spacing:-2px; }
  .place { font-size:34px; letter-spacing:4px; color:#bdbdbd; text-align:right; line-height:1.5; }
</style></head><body>
  <div class="bar b1"></div><div class="bar b2"></div>
  <div class="top"><span>SOUNDWAVE</span><span>FEST&nbsp;/&nbsp;2026</span></div>
  <div class="title">
    <div class="l">SOUND</div>
    <div class="l">WAVE</div>
    <div class="cn">声 浪</div>
  </div>
  <div class="meta">
    <div class="date">08.16—18</div>
    <div class="place">滨江公园<br>RIVERSIDE&nbsp;PARK</div>
  </div>
</body></html>
