<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1440px; overflow:hidden; }
  body { background:#13110d; color:#e9e2d2;
    font-family:"DejaVu Serif","WenQuanYi Zen Hei",serif;
    display:flex; flex-direction:column; padding:90px; position:relative; }
  .frame { position:absolute; inset:46px; border:2px solid #b9923f; opacity:.7; }
  .top { display:flex; justify-content:space-between; align-items:center;
    font-size:30px; letter-spacing:6px; color:#b9923f; }
  .mid { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .title { font-size:210px; font-weight:700; line-height:1.04; letter-spacing:10px;
    color:#f4ecdb; }
  .title .g { color:#d8b25a; }
  .rule { width:120px; height:3px; background:#b9923f; margin:54px 0 30px; }
  .sub { font-size:44px; letter-spacing:4px; color:#cbbfa3; }
  .bottom { display:flex; justify-content:space-between; align-items:flex-end;
    font-size:30px; letter-spacing:5px; color:#9b9078; }
</style></head><body>
  <div class="frame"></div>
  <div class="top"><span>BOOK&nbsp;CLUB</span><span>第 12 期</span></div>
  <div class="mid">
    <div class="title">深夜<br><span class="g">读书</span></div>
    <div class="rule"></div>
    <div class="sub">把一本书，读薄</div>
  </div>
  <div class="bottom"><span>每周三 · 线上共读</span><span>2026</span></div>
</body></html>
