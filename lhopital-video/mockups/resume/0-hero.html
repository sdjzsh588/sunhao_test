<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;font-family:"DejaVu Sans","WenQuanYi Zen Hei",sans-serif;}
  body{background:#101418;color:#e8eaed;overflow:hidden;}
  .card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:60px;}
  .icon{width:300px;height:300px;border-radius:64px;background:#1b2026;border:1px solid #2a3138;
    position:relative;box-shadow:0 24px 80px rgba(0,255,136,.18);display:flex;align-items:center;justify-content:center;}
  .doc{width:150px;height:196px;border-radius:14px;background:#f2f4f6;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.45);}
  .doc i{position:absolute;left:20px;right:20px;height:10px;border-radius:5px;background:#c4ccd4;}
  .doc i:nth-child(1){top:26px;width:70px;background:#1a5f9e;height:14px;}
  .doc i:nth-child(2){top:62px;}
  .doc i:nth-child(3){top:86px;right:48px;}
  .doc i:nth-child(4){top:110px;}
  .doc i:nth-child(5){top:134px;right:64px;}
  .check{position:absolute;right:38px;bottom:40px;width:88px;height:88px;border-radius:50%;
    background:linear-gradient(160deg,#00ff88,#00b365);display:flex;align-items:center;justify-content:center;
    font-size:52px;font-weight:900;color:#06130c;box-shadow:0 0 36px rgba(0,255,136,.5);}
  .word .name{font-size:128px;font-weight:800;letter-spacing:-2px;}
  .word .sub{margin-top:24px;font-size:48px;color:#9aa4ad;display:flex;align-items:center;gap:26px;}
  .badge{font-size:38px;font-weight:700;color:#0a0a0a;background:#00ff88;border-radius:999px;padding:10px 30px;}
</style></head><body>
  <div class="card">
    <div class="icon"><div class="doc"><i></i><i></i><i></i><i></i><i></i></div><div class="check">✓</div></div>
    <div class="word">
      <div class="name">ResumeSkills</div>
      <div class="sub"><span>开源 · 20 个求职技能</span><span class="badge">免费</span></div>
    </div>
  </div>
</body></html>
