<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;font-family:"DejaVu Sans","WenQuanYi Zen Hei",sans-serif;}
  body{background:#101418;color:#e8eaed;overflow:hidden;}
  .card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:60px;}
  .icon{width:300px;height:300px;border-radius:64px;background:#1b2026;border:1px solid #2a3138;
    position:relative;overflow:hidden;box-shadow:0 24px 80px rgba(0,255,136,.18);}
  /* left half: busy checker bg; right half: clean cut subject */
  .icon .bg{position:absolute;left:0;top:0;bottom:0;width:50%;
    background:repeating-conic-gradient(#2a3138 0% 25%,#222830 0% 50%) 0/52px 52px;}
  .icon .subj{position:absolute;right:46px;top:54px;width:150px;height:196px;
    border-radius:80px 80px 36px 36px;background:linear-gradient(160deg,#00ff88,#00b365);
    box-shadow:0 0 40px rgba(0,255,136,.45);}
  .icon .scis{position:absolute;left:120px;top:120px;font-size:70px;}
  .word .name{font-size:150px;font-weight:800;letter-spacing:-2px;}
  .word .sub{margin-top:24px;font-size:50px;color:#9aa4ad;display:flex;align-items:center;gap:26px;}
  .badge{font-size:40px;font-weight:700;color:#0a0a0a;background:#00ff88;border-radius:999px;padding:10px 30px;}
</style></head><body>
  <div class="card">
    <div class="icon"><div class="bg"></div><div class="subj"></div><div class="scis">✂</div></div>
    <div class="word">
      <div class="name">rembg</div>
      <div class="sub"><span>开源 · 一键去背景</span><span class="badge">★ 23.3k</span></div>
    </div>
  </div>
</body></html>
